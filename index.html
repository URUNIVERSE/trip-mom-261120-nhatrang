<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="나트랑 여행 지도와 날짜별 일정">
<title>나트랑 여행</title>
<style>
@font-face{
  font-family:'TextFont';
  src:local('SourceHanSansK-Regular'),url('./fonts/SourceHanSansK-Regular.otf') format('opentype');
  font-style:normal;
  font-weight:400;
  font-display:swap;
}
@font-face{
  font-family:'IconFont';
  src:local('TossFaceFontWeb'),url('./fonts/TossFaceFontWeb.otf') format('opentype');
  font-style:normal;
  font-weight:normal;
  font-display:swap;
  unicode-range:U+231A-231B,U+23E9-23EC,U+23F0,U+23F3,U+25FD-25FE,U+2600-26FF,U+2700-27BF,U+2B1B-2B1C,U+2B50,U+2B55,U+1F1E6-1F1FF,U+1F300-1F5FF,U+1F600-1F64F,U+1F680-1F6FF,U+1F700-1F77F,U+1F780-1F7FF,U+1F800-1F8FF,U+1F900-1F9FF,U+1FA00-1FAFF;
}
:root{
  --text-font-family:'TextFont','Noto Sans KR',sans-serif;
  --icon-font-family:'IconFont','TextFont','Noto Sans Symbols 2',sans-serif;
}
body,button,input,select,textarea{font-family:var(--text-font-family);}

:root{--ink:#292a28;--muted:#777873;--paper:#f7f6f2;--white:#fffefa;--line:#e7e4dc;--soft:#efeee8;--black:#343633;--shadow:0 8px 24px rgba(48,48,42,.07);--radius:18px;--sage:#a8b9a8;--sage-deep:#718b78;--rose:#d9aeb3;--rose-deep:#a97981;--warmgray:#aaa9a3;--mocha:#b99b83;--blue:#a8b9c9;--gold:#d4bd83}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--text-font-family);font-size:17px;line-height:1.58}
button{font:inherit}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #8c9d8d;outline-offset:3px}
.app{width:min(100%,1320px);margin:0 auto;padding:18px 16px 42px}header{padding:12px 4px 18px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;color:#85867f}h1{margin:3px 0 2px;font-size:clamp(30px,5vw,44px);line-height:1.2;letter-spacing:-.04em}.subtitle{margin:7px 0 0;color:var(--muted);font-size:16px}
.today-chip{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:8px 14px;border-radius:999px;background:#e8eee8;color:#536c59;font-size:14px;font-weight:800}
.main-tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:6px;margin-bottom:16px;background:#eeede7;border-radius:15px}.main-tab{min-height:56px;border:0;border-radius:11px;background:transparent;color:#64655f;font-weight:800;cursor:pointer}.main-tab[aria-selected="true"]{background:#dfe8df;color:#405a47;box-shadow:0 2px 8px rgba(70,90,70,.08)}
.travel-layout{display:grid;grid-template-columns:88px minmax(0,1fr);gap:16px;align-items:start}.date-nav{position:sticky;top:12px;display:grid;gap:9px;padding:8px;border:1px solid var(--line);border-radius:16px;background:var(--white);box-shadow:0 3px 12px rgba(0,0,0,.025)}.date-nav-label{padding:4px 0 1px;text-align:center;color:var(--muted);font-size:12px;font-weight:800;letter-spacing:.04em}
.date-button{min-height:72px;border:1px solid #e8e6df;border-radius:12px;background:#f8f7f3;color:#4b4c47;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}.date-button .day-number{font-size:27px;line-height:1.15;font-weight:900}.date-button .day-week{font-size:12px;font-weight:700;color:#85867f}.date-button[aria-pressed="true"]{background:#dfe8df;color:#405a47;border-color:#cbd9cc;box-shadow:0 3px 8px rgba(80,105,82,.08)}.date-button[aria-pressed="true"] .day-week{color:#607865}.date-button.is-today:not([aria-pressed="true"]){border:2px solid #a8b9a8;background:#fffefa}
.panel[hidden]{display:none}.panel{min-width:0}.section-heading{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:3px 2px 13px}h2{margin:0;font-size:24px;letter-spacing:-.03em}.helper{margin:3px 0 0;color:var(--muted);font-size:14px}
.day-summary{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 13px;padding:13px 16px;border:1px solid #e4e7df;border-radius:14px;background:#f0f3ed}.day-summary strong{font-size:19px}.day-summary span{font-size:14px;color:#73786f}.today-label{display:none;flex:0 0 auto;padding:4px 10px;border-radius:999px;background:#dce7dc;color:#4c6852!important;font-size:12px!important;font-weight:800}.day-summary.today .today-label{display:inline-block}
.day-summary.day-20{background:#f5eceb;border-color:#eadbd9}.day-summary.day-21{background:#edf2eb;border-color:#dce6d9}.day-summary.day-22{background:#f0eef5;border-color:#e1ddeb}.day-summary.day-23{background:#edf1f5;border-color:#dce4eb}

.map-caption{padding:10px 14px;border-top:1px solid var(--line);background:#fbfaf7;color:#777873;font-size:13px;font-weight:700;text-align:center}
.schedule-card,.hotel-card{overflow:hidden;border:1px solid var(--line);border-radius:16px;background:var(--white);box-shadow:0 4px 14px rgba(0,0,0,.025)}.schedule-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;background:#e8eee8;color:#4d6653}.schedule-head h3{margin:0;font-size:20px}.schedule-card.day-20 .schedule-head{background:#f1e3e2;color:#79585c}.schedule-card.day-21 .schedule-head{background:#e5eee3;color:#4f6953}.schedule-card.day-22 .schedule-head{background:#ece8f2;color:#655d78}.schedule-card.day-23 .schedule-head{background:#e6edf3;color:#53697d}.today .schedule-head{font-weight:800}.event-list{padding:4px 15px 12px}

.event{
  display:grid;
  grid-template-columns:88px minmax(0,1fr);
  align-items:center;
  gap:12px;
  padding:13px 2px;
  border-bottom:1px solid #efeee8;
}
.event:last-child{border-bottom:0}

.event-time{
  align-self:center;
  display:inline-block;
  padding:4px 8px;
  border-radius:8px;
  background:#f0f1eb;
  color:#66705f;
  font-size:14px;
  font-weight:900;
  white-space:nowrap;
}

.event-content{min-width:0}

.event-main-line{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
}

.event-title{
  flex:1;
  min-width:0;
  font-size:17px;
  font-weight:900;
}

.event-note{
  margin-top:3px;
  color:var(--muted);
  font-size:14px;
}

.event-link{
  flex:0 0 auto;
  margin:0;
  padding:6px 9px;
  border:1px solid #dcded5;
  border-radius:9px;
  background:#f6f7f2;
  color:#586b59;
  font-size:12px;
  font-weight:800;
  white-space:nowrap;
  cursor:pointer;
}

@media(max-width:600px){
  .event{
    grid-template-columns:68px minmax(0,1fr);
    gap:7px;
  }
  .event-time{
    padding:4px 5px;
    font-size:12px;
  }
  .event-main-line{gap:5px}
  .event-title{font-size:14px}
  .event-link{
    padding:5px 6px;
    font-size:11px;
  }
}
.hotel-section{display:grid;gap:9px;margin-bottom:14px}.hotel-section h3{margin:0 0 1px;font-size:19px}.hotel-card{display:flex;align-items:flex-start;gap:12px;padding:14px;background:#eef2f5;border-color:#dfe6eb}.hotel-card .hotel-icon{font-family:var(--icon-font-family);font-size:23px;color:#7890a4}.hotel-card strong{display:block;font-size:17px}.hotel-card small{display:block;margin-top:3px;color:#747b80;font-size:13px}
.candidate-section{margin-top:20px}.candidate-section h3{margin:0 0 9px;font-size:20px}.candidate-intro{margin:-3px 0 10px;color:var(--muted);font-size:14px}.meal-groups{display:grid;gap:12px}.meal-group{border:1px solid var(--line);border-radius:15px;background:var(--white);overflow:hidden}.meal-group h4{margin:0;padding:12px 14px;background:#f0efe9;font-size:17px;color:#555750}.meal-group.massage h4{background:#edf2ec;color:#617966}.meal-group.shopping h4{background:#f5eded;color:#956f75}.meal-group.restaurant h4{background:#efefed;color:#6e706c}.meal-group.cafe h4{background:#f3eee8;color:#8b725e}.meal-group.sight h4{background:#f5f1e5;color:#8b7950}.meal-group.hotel h4{background:#edf1f5;color:#63798c}.meal-group .group-content{padding:10px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.place-card{min-width:0;display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid #e8e6df;border-radius:12px;background:#fffefa;text-align:left;cursor:pointer}.place-card .card-emoji{width:28px;height:30px;display:grid;place-items:center;flex:0 0 28px;font-family:var(--icon-font-family);font-size:21px;color:#7b8f7d;background:transparent;border:0;border-radius:0}.place-card.massage .card-emoji{color:#819b85}.place-card.shopping .card-emoji{color:#bd8c94}.place-card.restaurant .card-emoji{color:#858681}.place-card.cafe .card-emoji{color:#a68a72}.place-card.sight .card-emoji{color:#b39a61}.place-card.hotel .card-emoji{color:#8299ae}.place-card .card-copy{min-width:0}.place-card strong{display:block;font-size:15px;overflow-wrap:anywhere}.place-card small{display:block;color:#777873;font-size:12px;overflow-wrap:anywhere}.place-card.featured{border:1.5px solid #a6b8a6;background:#f7faf5}.place-card.featured .card-emoji{color:#637e68}
.empty{padding:20px 16px;border:1px dashed #d8d6cf;border-radius:14px;background:#fffefa;color:#777873;text-align:center}.empty strong{display:block;margin-bottom:4px;color:#454640}
.detail-backdrop{position:fixed;inset:0;z-index:2000;display:none;align-items:flex-end;justify-content:center;padding:12px;background:rgba(38,39,35,.42)}.detail-backdrop.open{display:flex}.detail{width:min(100%,620px);max-height:min(88vh,820px);overflow:auto;padding:21px;border-radius:20px;background:#fffefa;box-shadow:0 18px 60px rgba(0,0,0,.18)}.detail-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.detail-title{margin:0;font-size:24px;line-height:1.3}.category-tag{display:inline-block;margin-top:7px;padding:4px 10px;border-radius:999px;background:#eef0e9;color:#687563;font-size:13px;font-weight:800}.close{width:44px;height:44px;flex:0 0 44px;border:0;border-radius:50%;background:#f0efe9;color:#555;font-size:26px;cursor:pointer}.detail-description{margin:15px 0 2px;padding:12px 14px;border-radius:12px;background:#f4f3ed;font-size:15px;color:#4f504b}.detail-info{display:grid;gap:13px;margin:17px 0}.info-row{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;align-items:start}.info-icon{font-size:19px}.info-label{display:block;color:#85867f;font-size:12px}.info-value{display:block;font-size:16px;font-weight:800;overflow-wrap:anywhere}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:17px}.action{display:flex;align-items:center;justify-content:center;gap:7px;min-height:56px;padding:10px;border:1px solid #d9ddd4;border-radius:12px;font-weight:900;text-align:center;cursor:pointer;text-decoration:none}.action.primary{grid-column:1/-1;background:#e3ebe2;color:#4b654f;border-color:#d4e0d3}.action.secondary{background:#f8f7f2;color:#64675f}.toast{position:fixed;z-index:2200;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;padding:12px 18px;border-radius:999px;background:#596e5b;color:#fff;font-size:13px;font-weight:800;transition:.2s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}footer{padding:24px 4px 4px;color:#92928b;te function escapeHtml(value=''){
 return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function localDateString(now=new Date()){
 const parts=new Intl.DateTimeFormat('en-CA',{timeZone:TRAVEL.timeZone,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(now);
 const get=t=>parts.find(p=>p.type===t)?.value||'';
 return `${get('year')}-${get('month')}-${get('day')}`;
}
function formatDate(s){const [,m,d]=s.split('-');return `${Number(m)}월 ${Number(d)}일`;}

 $('local-date').textContent=`${formatDate(date)} (${weekday})`;
}

// Static image map: markers are positioned over the supplied Nha Trang screenshot.
const MAP_BOUNDS={west:109.1765,east:109.2095,north:12.2570,south:12.2240};
// Small visual corrections for landmarks that are clearly identifiable in the screenshot.
// Coordinates are image pixels (761 × 777), not geographic coordinates.
const MANUAL_MAP_POSITIONS={
  havana:{x:432,y:309},       // align with the Havana Hotel marker on the map image
  cathedral:{x:208,y:207}    // align with the church-cross symbol
};
function initMap(){renderMapMarkers();}
function mapPixel(place){
 const x=(place.lon-MAP_BOUNDS.west)/(MAP_BOUNDS.east-MAP_BOUNDS.west)*761;
 const y=(MAP_BOUNDS.north-place.lat)/(MAP_BOUNDS.north-MAP_BOUNDS.south)*777;
 return {x,y};
}
// 아이콘 폰트와 유니코드 지정은 이 객체 한 곳에서 관리합니다.
// MyIconFont.woff2를 HTML과 같은 폴더에 업로드한 뒤, 각 값을 원하는 글리프 코드로 바꾸세요.
// 예: massage: 0xE001  또는  massage: 0xF101
const ICON_UNICODE = {
  // 카테고리 아이콘: TossFace가 지원하는 표준 Unicode 이모지
  massage:0x1F33F,       // 허브/식물
  shopping:0x1F381,      // 쇼핑백
  restaurant:0x1F37D,    // 접시와 식기
  cafe:0x2615,           // 커피
  hotel:0x1F5DD,         // 호텔
  sight:0x1F54D,         // 고전 건축물
  // 보조 UI 아이콘
  clock:0x23F0,          // 알람 시계
  map:0x1F5FA,           // 세계 지도
  calendar:0x1F4C5,      // 달력
  location:0x1F4CD,      // 위치 핀
  directions:0x27A4,     // 방향 화살표
  copy:0x1F4CB,          // 클립보드
  arrowDown:0x2193, arrowDownRight:0x2198,
  arrowUp:0x2191, arrowUpLeft:0x2196,
  close:0x00D7
};
function iconChar(type){return String.fromCodePoint(ICON_UNICODE[type] ?? ICON_UNICODE.location);}
function iconGlyph(type,extraClass=''){return `<span class="icon-glyph ${extraClass}" aria-hidden="true">${iconChar(type)}</span>`;}
function markerEmoji(place){return iconGlyph(place.type);}

function applyConfiguredIcons(){
 document.querySelectorAll('[data-icon]').forEach(el=>{const key=el.dataset.icon;if(ICON_UNICODE[key]!=null)el.textContent=iconChar(key);});
}

function renderMapMarkers(){
 const root=$('travel-map'); if(!root)return;
 root.querySelectorAll('.map-marker').forEach(el=>el.remove());
 const places=allNhaTrangPlaces().filter(p=>Number.isFinite(p.lat)&&Number.isFinite(p.lon));
 const occupied=[];
 places.forEach(place=>{
  const raw=mapPixel(place); let x=raw.x,y=raw.y;
  const manual=MANUAL_MAP_POSITIONS[place.id];
  const outside=x<8||x>753||y<8||y>769;
  if(manual){x=manual.x;y=manual.y;}
  else if(outside){
   // Keep off-map destinations on the outer rim instead of pulling them toward the center.
   if(place.id==='vinpearl'){x=748;y=690;}          // far southeast edge: island resort, separated from airport marker
   else if(place.id==='ponagar'){x=440;y=23;}      // north edge: Po Nagar
   else {x=Math.max(12,Math.min(749,x));y=Math.max(12,Math.min(765,y));}
  }
  else {
   // Give nearby central venues a little more breathing room while preserving their general direction.
   let found=false;
   for(let radius=0;radius<=78&&!found;radius+=12){
    for(let step=0;step<(radius===0?1:16);step++){
     const angle=step*Math.PI/8;
     const cx=raw.x+(radius?Math.cos(angle)*radius:0),cy=raw.y+(radius?Math.sin(angle)*radius:0);
     if(cx>20&&cx<741&&cy>20&&cy<757&&occupied.every(o=>Math.hypot(cx-o.x,cy-o.y)>40)) {x=cx;y=cy;found=true;break;}
    }
   }
  }
  occupied.push({x,y});
  const button=document.createElement('button');
  const highlighted=isHighlighted(place);const highlightedDayClass=highlighted?` featured day-${activeDate.slice(-2)}`:'';
  button.type='button';button.className=`map-marker ${place.type}${highlightedDayClass}${outside?' edge':''}${place.id==='vinpearl'?' edge-east':''}`;
  button.style.setProperty('--x',`${x/761*100}%`);button.style.setProperty('--y',`${y/777*100}%`);
  button.title=place.name;button.setAttribute('aria-label',place.name);
  if(place.id==='vinpearl') button.innerHTML=`${escapeHtml(place.shortName||place.name)}<span class="arrow">${iconChar('arrowDownRight')}</span>`;
  else if(outside) button.innerHTML=`<span class="arrow">${raw.y<0?iconChar('arrowUp'):raw.x<0?iconChar('arrowUpLeft'):iconChar('arrowDown')}</span>${escapeHtml(place.shortName||place.name)}`;
  else button.innerHTML=markerEmoji(place);
  button.addEventListener('click',()=>showPlace(place));root.appendChild(button);
 });
 // Airport is outside the city screenshot; show a directional marker only.
 const airport=document.createElement('button');
 airport.type='button';
 const airportHighlighted=isHighlighted(AIRPORT_PLACE);
 airport.className=`map-marker edge hotel edge-bottom${airportHighlighted?` featured day-${activeDate.slice(-2)}`:''}`;
 airport.style.setProperty('--x','56%');airport.style.setProperty('--y','99%');
 airport.innerHTML=`깜란 공항<span class="arrow icon-glyph">${iconChar('arrowDown')}</span>`;
 airport.title='깜란 국제공항 · 20일 도착 및 23일 출국';
 airport.setAttribute('aria-label',`깜란 국제공항${airportHighlighted?' · 선택한 날짜 일정':''}, 지도 아래쪽 방향`);
 airport.addEventListener('click',()=>showPlace(AIRPORT_PLACE));
 root.appendChild(airport);
}
function addInfoRow(icon,label,value){
 if(!value)return '';
 return `<div class="info-row"><span class="info-icon">${icon}</span><div><span class="info-label">${escapeHtml(label)}</span><span class="info-value">${escapeHtml(value)}</span></div></div>`;
}
function cleanAddress(place){
 const address=String(place.address||'').trim();
 if(!address||/Google 지도 위치|좌표/i.test(address))return '';
 return address;
}
function showPlace(place){
 activePlace=place;const m=META[place.type]||{label:'장소'};
 $('detail-title').textContent=`${m.label||'장소'} · ${place.name}`;
 $('detail-category').textContent=m.label;
 const description=String(place.description||'').replace(/\s*후보 메모예요\.?/g,'').replace(/\s*후보예요\.?/g,'이에요.').replace(/이라는 제공받은 후보 설명이에요\.?/g,'이에요.');
 $('detail-description').textContent=description;
 $('detail-description').hidden=!description;
 const address=cleanAddress(place);
 $('detail-info').innerHTML=[
  addInfoRow(iconGlyph('location'),'주소',address),
  addInfoRow(iconGlyph('clock'),'영업시간',place.hours)
 ].join('');
 $('copy-button').innerHTML=address?`${iconGlyph('copy')} 주소 복사`:`${iconGlyph('copy')} 위치 링크 복사`;
 $('detail-backdrop').classList.add('open');$('detail-close').focus();
}
window.showPlaceById=id=>{const p=placeById(id);if(p)showPlace(p);};
function closeDetail(){$('detail-backdrop').classList.remove('open');activePlace=null;}
$('detail-close').addEventListener('click',closeDetail);
$('detail-backdrop').addEventListener('click',e=>{if(e.target===$('detail-backdrop'))closeDetail();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail();});
function destinationFor(place){
 if(place.approx&&cleanAddress(place))return `${place.name}, ${cleanAddress(place)}`;
 return `${place.lat},${place.lon}`;
}
$('directions-button').addEventListener('click',()=>{
 if(!activePlace)return;
 const url=`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(destinationFor(activePlace))}&travelmode=driving`;
 window.open(url,'_blank','noopener,noreferrer');
});
$('copy-button').addEventListener('click',async()=>{
 if(!activePlace)return;
 const text=cleanAddress(activePlace)||activePlace.mapsUrl||`${activePlace.name}, Nha Trang, Vietnam`;
 try{await navigator.clipboard.writeText(text);showToast(cleanAddress(activePlace)?'주소를 복사했어요.':'위치 링크를 복사했어요.');}
 catch{
  const input=document.createElement('textarea');input.value=text;input.style.position='fixed';input.style.opacity='0';document.body.appendChild(input);input.select();
  const ok=document.execCommand('copy');input.remove();showToast(ok?'복사했어요.':'복사할 수 없어요.');
 }
});
function renderHotelSection(){
 const hotels=TRAVEL.places.filter(p=>p.type==='hotel'&&Array.isArray(p.days)&&p.days.includes(activeDate));
 $('hotel-section').innerHTML='<h3>HOTEL INFO</h3>'+(hotels.length?hotels.map(h=>`<button type="button" class="hotel-card" data-place-id="${h.id}" style="width:100%;text-align:left;cursor:pointer"><span class="hotel-icon">${iconGlyph('hotel')}</span><span><strong>${escapeHtml(h.name)}</strong><small>${escapeHtml(cleanAddress(h))}</small><small>${h.id==='havana'?'11월 20일':'11월 21일 - 11월 23일'}</small></span></button>`).join(''):'<div class="empty">숙박 정보가 없어요.</div>');
 bindPlaceButtons($('hotel-section'));
}
function renderSchedule(){
 const items=TRAVEL.schedule[activeDate]||[];
 if(!items.length){$('schedule-list').innerHTML='<div class="empty"><strong>등록된 일정이 없어요.</strong></div>';return;}
 const eventHtml=items.map(item=>{
  const place=item.placeId?placeById(item.placeId):null;

  const link=place
    ? `<button type="button" class="event-link" data-place-id="${place.id}">${iconGlyph('location')} 장소 정보 보기</button>`
    : '';

  return `
    <div class="event">
      <div class="event-time">
        ${escapeHtml(item.time||'예정')}
      </div>

      <div class="event-content">
        <div class="event-main-line">
          <div class="event-title">
            ${escapeHtml(item.title)}
          </div>
          ${link}
        </div>

        ${item.note
          ? `<div class="event-note">${escapeHtml(item.note)}</div>`
          : ''}
      </div>
    </div>
  `;
}).join('');
 $('schedule-list').innerHTML=`<article class="schedule-card day-${activeDate.slice(-2)} ${localDateString()===activeDate?'today':''}"><div class="schedule-head"><h3>${formatDate(activeDate)} 일정</h3>${localDateString()===activeDate?'<span class="today-label" style="display:inline-block">오늘</span>':''}</div><div class="event-list">${eventHtml}</div></article>`;
 bindPlaceButtons($('schedule-list'));
}
function placeCard(place){
 const m=META[place.type],featured=isHighlighted(place);
 const subtitle=featured?'오늘 일정':(place.hours||m.label);
 return `<button type="button" class="place-card ${place.type} ${featured?'featured':''}" data-place-id="${place.id}"><span class="card-emoji">${iconGlyph(place.type)}</span><span class="card-copy"><strong>${escapeHtml(place.name)}</strong><small>${escapeHtml(subtitle)}</small></span></button>`;
}
function bindPlaceButtons(container){
 container.querySelectorAll('[data-place-id]').forEach(btn=>btn.addEventListener('click',()=>{const place=placeById(btn.dataset.placeId);if(place)showPlace(place);}));
}
function renderMeals(){
 const groups=[
  {type:'massage',title:'마사지'},
  {type:'shopping',title:'쇼핑'},
  {type:'restaurant',title:'음식점'},
  {type:'cafe',title:'카페'},
  {type:'sight',title:'관광지'},
  {type:'hotel',title:'호텔'}
 ];
 $('meal-groups').innerHTML=groups.map(group=>{
  const places=TRAVEL.places.filter(p=>p.region==='nha-trang'&&p.type===group.type);
  return `<section class="meal-group ${group.type}"><h4>${iconGlyph(group.type)} ${group.title} ${places.length}곳</h4><div class="group-content">${places.map(placeCard).join('')||'<div class="empty">등록된 장소가 없어요.</div>'}</div></section>`;
 }).join('');
 bindPlaceButtons($('meal-groups'));
}

renderDateNav();renderDaySummary();renderSchedule();renderHotelSection();renderMeals();initMap();applyConfiguredIcons();updateLocalDate();
setInterval(()=>{updateLocalDate();renderDateNav();renderDaySummary();renderSchedule();renderHotelSection();renderMeals();renderMapMarkers();},60000);
</script>
